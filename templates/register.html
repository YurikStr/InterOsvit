
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Реєстрація — InterOsvit</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>

    <main class="container">

        <h1>Реєстрація</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <!-- CSRF-захист форми реєстрації -->
            <input
                type="hidden"
                name="register_csrf_token"
                value="{{ register_csrf_token }}"
            >

            <label for="username">
                Ім'я користувача
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >

            <label for="email">
                Електронна пошта
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="password">
                Пароль
            </label>

            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Зареєструватися
            </button>

        </form>

        <p>
            Уже маєте обліковий запис?
            <a href="{{ url_for('login') }}">
                Увійти
            </a>
        </p>

        <p>
            <a href="{{ url_for('home') }}">
                На головну
            </a>
        </p>

    </main>

</body>
</html>
